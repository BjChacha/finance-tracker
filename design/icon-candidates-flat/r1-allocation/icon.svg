<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- 花哪了 · 极简环 · 候选 1 · 配置环 Allocation Ring -->
  <!-- 环 = 资产配置份额：琥珀 50% / 近黑 30% / 中性灰 20%，顺时针排布；环心完全留白 -->
  <!-- 几何：外半径 308，描边宽 96，中心线半径 260，内半径 212；平头端点（图表的精确感） -->
  <!-- 缺口 6°：每段 = 份额角(180°/108°/72°) − 6°，三个缺口等分跨在 0°/180°/288° 份额边界上，白底透出 -->
  <!-- 纯扁平：只有实色填充，无渐变 / 滤镜 / 阴影 / 光效 / 透明度 / 文字 / 外链 -->
  <rect x="0" y="0" width="1024" height="1024" fill="#FFFFFF"/>
  <g fill="none" stroke-width="96" stroke-linecap="butt">
    <!-- 50% 琥珀：份额边界 0°→180°，可见弧 3°→177° -->
    <path d="M525.61 252.36 A260 260 0 0 1 525.61 771.64" stroke="#F59E0B"/>
    <!-- 30% 近黑：份额边界 180°→288°，可见弧 183°→285° -->
    <path d="M498.39 771.64 A260 260 0 0 1 260.86 444.71" stroke="#1C1917"/>
    <!-- 20% 中性灰：份额边界 288°→360°，可见弧 291°→357° -->
    <path d="M269.27 418.82 A260 260 0 0 1 498.39 252.36" stroke="#A8A29E"/>
  </g>
</svg>
